<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แอปที่พัก</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Anuphan:wght@400;500;600;700&display=swap">
<style>
/* ธีมเดียวกับแอปตาม Slide CBC: สว่างแบบห้องปฏิบัติการ พื้นขาว-ฟ้าอ่อน ตัวอักษรน้ำเงินเข้ม
   สีหลักเขียวน้ำทะเล ปุ่มเมนูไล่เฉด เขียว/ฟ้า/ม่วง/ส้ม ตัวหนังสือขยายได้ 3 ระดับ (ผู้ใช้สูงอายุอ่านง่าย) */
:root{
  color-scheme:light;
  --bg:#eef3f7; --surface:#ffffff; --sunk:#f7fafc; --ink:#102a43; --muted:#52677d; --line:#d6e1ea;
  --teal:#0b7a75; --teal-soft:#e1f3f1; --blue:#1f5fae; --blue-soft:#e7eff9; --violet:#5a45a8; --violet-soft:#efecfa;
  --acc:var(--teal); --on-acc:#ffffff;
  --ok:#1a7f4b; --ok-bg:#e3f4ea; --warn:#a85300; --warn-bg:#fff3df; --bad:#b42318; --bad-bg:#fdeceb; --info:#1f5fae; --info-bg:#e7eff9; --mute-bg:#eceff2;
  --m1:#009688; --m2:#1f5fae; --m3:#5a45a8; --m4:#c07a12;
  --shadow:0 1px 2px rgba(16,42,67,.06),0 4px 14px rgba(16,42,67,.06);
  --f-head:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
html{font-size:calc(16px * var(--fs,1.12))}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6}
h1,h2,h3{font-family:var(--f-head);margin:0;line-height:1.25;text-wrap:balance}
h2{font-size:1.3rem}h3{font-size:1.05rem}
button,input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.86rem}

.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.mark{width:40px;height:40px;border-radius:11px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.brand b{display:block;font-family:var(--f-head);font-size:1.12rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{display:block;font-size:.8rem;color:var(--muted)}
.brand>div{min-width:0}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;flex:none}
.av{width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:.9rem}
.demo{background:var(--sunk);border-bottom:1px solid var(--line)}
.demo-in{max-width:980px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.86rem;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo-tag{font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:1px 8px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:7px;padding:4px 10px;cursor:pointer;color:var(--muted);font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc)}

main{max-width:980px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.narrow{max-width:560px;margin:0 auto;width:100%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);min-width:0}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hello h2{font-size:1.5rem}
.date{font-size:.9rem;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:transform .12s,border-color .2s}
.tile:hover{border-color:var(--acc)}
.tile:active{transform:scale(.98)}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ic{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);display:grid;place-items:center;flex:none}
.ic svg{width:24px;height:24px}
.count{text-align:right;line-height:1.1}
.count b{display:block;font-family:var(--f-head);font-size:1.7rem;font-variant-numeric:tabular-nums}
.count span{font-size:.75rem;color:var(--muted)}
.tile h3{font-size:1.08rem}
.tile p{margin:0;font-size:.85rem;color:var(--muted)}
.flag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;border-radius:999px;padding:2px 10px;align-self:flex-start}
.flag.bad{background:var(--bad-bg);color:var(--bad)}.flag.ok{background:var(--ok-bg);color:var(--ok)}

.panel.news{flex-direction:row;gap:14px;align-items:flex-start}
.news .ic{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.news-t{min-width:0;flex:1}
.news-t b{font-family:var(--f-head);font-size:1.05rem;display:block}
.news-t p{margin:2px 0 0;font-size:.9rem;color:var(--muted);white-space:pre-line}

.page-head{display:flex;flex-direction:column;gap:10px}
.back{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px 7px 10px;font-weight:600;cursor:pointer}
.back svg{width:20px;height:20px}
.title-row{display:flex;align-items:center;gap:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn-acc{background:var(--acc);color:var(--on-acc)}
.btn-acc:hover{filter:brightness(1.07)}
.btn-line{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--acc)}
.btn-ok{background:var(--ok);color:var(--surface)}.btn-bad{background:var(--bad-bg);color:var(--bad)}
.btn-sm{padding:7px 12px;font-size:.88rem;border-radius:9px}
.btn-block{width:100%;padding:14px}
.btn:disabled{opacity:.6;cursor:wait}
.big-act{min-height:76px;font-size:1.02rem;border-radius:14px}

.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lab{font-weight:600;font-size:.94rem}
.opt{font-weight:400;color:var(--muted);font-size:.84rem}
.input{width:100%;min-width:0;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--sunk);font-size:1rem}
textarea.input{min-height:84px;resize:vertical}
.input:focus{outline:none;border-color:var(--acc);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 15%,transparent)}
.scanrow{display:flex;gap:8px}.scanrow .input{flex:1}
.cam{flex:none;width:52px;border:0;border-radius:10px;background:var(--acc);color:var(--on-acc);cursor:pointer;display:grid;place-items:center}
.cam svg{width:24px;height:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toolbar .input{max-width:260px}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:13px 2px;border-top:1px solid var(--line);align-items:start}
.item:first-child{border-top:0}
.item.click{cursor:pointer;border-radius:10px;padding-inline:8px;margin-inline:-6px}
.item.click:hover{background:var(--sunk)}
.item-main{min-width:0}
.item-main b{font-weight:600}
.item-sub{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.item-act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tagno{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-open{background:var(--warn-bg);color:var(--warn)}.t-doing{background:var(--info-bg);color:var(--info)}
.t-done{background:var(--ok-bg);color:var(--ok)}.t-issue{background:var(--bad-bg);color:var(--bad)}.t-rejected{background:var(--mute-bg);color:var(--muted)}
.late{color:var(--bad);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:.92rem}
.alert{padding:11px 14px;border-radius:10px;font-size:.92rem;white-space:pre-line}
.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.info{background:var(--info-bg);color:var(--info)}.alert.ok{background:var(--ok-bg);color:var(--ok)}

.ticket-no{border:2.5px dashed var(--acc);border-radius:14px;padding:16px;text-align:center}
.ticket-no b{display:block;font-family:var(--f-mono);font-size:2rem;letter-spacing:.06em;color:var(--acc)}
.done{align-items:center;text-align:center}
.tick{width:60px;height:60px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:.94rem;text-align:left}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}

.chk{display:flex;flex-direction:column;gap:8px}
.chk-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px}
.chk-ph{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chk-cam{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--acc);color:var(--acc);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:600;font-size:.86rem;cursor:pointer}
.chk-cam svg{width:18px;height:18px}.chk-cam.need{border-style:solid;background:color-mix(in srgb,var(--acc) 8%,var(--surface))}
.chk-ph img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.chk-ph .tm{font-size:.78rem;color:var(--muted)}
.chk-pv{display:flex;gap:8px;align-items:center}
.chk-row.ok{border-color:var(--ok);background:var(--ok-bg)}.chk-row.no{border-color:var(--bad);background:var(--bad-bg)}
.yn{display:flex;gap:6px}
.yn button{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.88rem}
.yn button.y[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.yn button.n[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.listcard{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.listcard:hover{border-color:var(--acc)}
.listcard b{font-family:var(--f-head);font-size:1.02rem}

.photo-take{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--line);border-radius:12px;padding:14px;background:var(--sunk);color:var(--acc);font-weight:600;cursor:pointer}
.photo-take svg{width:22px;height:22px}
.photo-prev{display:flex;gap:12px;align-items:center}
.photo-prev img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}

.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;align-self:flex-start}
.tabs button{border:0;background:none;border-radius:9px;padding:8px 16px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.kpi-h{display:flex;align-items:center;gap:8px;font-weight:600;font-family:var(--f-head)}
.sw{width:11px;height:11px;border-radius:3px;flex:none}
.kpi-n{display:flex;gap:16px;flex-wrap:wrap}
.kpi-n div{display:flex;flex-direction:column;line-height:1.2}
.kpi-n b{font-family:var(--f-head);font-size:1.5rem;font-variant-numeric:tabular-nums}
.kpi-n span{font-size:.75rem;color:var(--muted)}
.kpi-n .bad b{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.plot svg{display:block;width:100%}
.plot text{font-family:var(--f-body);font-size:11.5px;fill:var(--muted)}
.plot .val{fill:var(--ink);font-weight:600}
.urow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.urow:first-child{border-top:0}

/* บิลค่าเช่า */
.bill{width:100%;border-collapse:collapse;font-size:.94rem}
.bill td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
.bill td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
.bill .calc{display:block;font-size:.8rem;color:var(--muted)}
.bill tr.sum td{border-top:2px solid var(--ink);font-weight:700;font-size:1.05rem}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mh{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mh b{font-family:var(--f-head)}
.mtot{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.mtot.bad{color:var(--bad);font-family:var(--f-body);font-size:.84rem}
.mtot.warn{color:#B45309;font-family:var(--f-body);font-size:.84rem;white-space:normal}
.duo{display:grid;gap:16px;align-items:start}.duo>div:empty{display:none}.duo .newsbig{margin:0}@media (min-width:900px){.duo:has(#news-top:not(:empty)){grid-template-columns:1fr 1fr}}
.today .item{width:100%;text-align:left;border:0;background:none;font:inherit;color:inherit;display:flex;align-items:center;gap:12px}.today .ic-s{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--soft,#eef6f5);flex:none}.today.ok{color:var(--good,#047857)}.tmbox{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.mrow .field label{font-size:.82rem;font-weight:500;color:var(--muted)}
.mrow.billed{grid-template-columns:1fr;color:var(--muted)}
.meter{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--acc)}
/* ประกาศใหญ่หน้าแรก */
.newsbig{padding:0;overflow:hidden;gap:0;cursor:pointer;text-align:left;border:1px solid #dde7ef;width:100%;font:inherit;color:inherit}
.newsbig img,.newsimg{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--sunk)}
.newsbig .nb{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.newsbig .tag{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--teal-soft);color:var(--teal);font-weight:600;font-size:.8rem;border-radius:999px;padding:2px 10px}
.newsbig .tag svg{width:16px;height:16px}
.newsbig h2{font-size:1.35rem}
.newsbig p{margin:0;color:var(--muted);white-space:pre-line}
.newsimg{border-radius:12px;margin-top:8px}
/* เลือกบทบาทในหน้าเข้าสู่ระบบ */
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.role{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;color:var(--ink);transition:transform .1s,border-color .2s,background .2s}
.role svg{width:28px;height:28px;color:var(--muted)}
.role[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.role[aria-pressed="true"] svg{color:var(--teal)}
.role:active{transform:scale(.97)}
.linkbtn{background:none;border:0;color:var(--blue);cursor:pointer;padding:4px 0;font-size:.92rem;text-decoration:underline;align-self:center}
.codebox{font-family:var(--f-mono);font-size:2.2rem;letter-spacing:.2em;text-align:center;border:2.5px dashed var(--teal);border-radius:14px;padding:12px;color:var(--teal)}
.urow{grid-template-columns:minmax(0,1fr)!important;gap:8px!important}
.urow>.chips{flex-wrap:wrap;gap:6px}
/* ผังห้อง */
.rbld{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.rfloor{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start}
.rfl{font-size:.8rem;color:var(--muted);padding-top:8px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.rc{position:relative;height:40px;border-radius:9px;border:2px solid transparent;font-family:var(--f-mono);font-weight:600;font-size:.88rem;cursor:pointer;transition:transform .1s}
.rc:active{transform:scale(.95)}
.rc-vac{background:var(--mute-bg);color:var(--muted);border-color:var(--line)}
.rc-ok{background:var(--ok-bg);color:var(--ok)}
.rc-due{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.rc-late{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.rc-slip{background:var(--info-bg);color:var(--info);border-color:var(--info)}
.rc-rep{position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--m4);border:2px solid #fff}
.rc-dot{display:inline-block;width:12px;height:12px;border-radius:4px}
.rc-dot.rc-vac{border:1px solid var(--line)}
/* แชต */
.thread{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding:4px 2px;background:var(--sunk);border-radius:12px;padding:10px}
.bub{max-width:82%;padding:8px 12px;border-radius:14px 14px 14px 4px;background:#fff;border:1px solid var(--line);align-self:flex-start;white-space:pre-line;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--teal);color:#fff;border-color:var(--teal);border-radius:14px 14px 4px 14px}
.bub small{display:block;font-size:.72rem;opacity:.75;margin-top:2px}
.sendrow{display:flex;gap:8px}.sendrow .input{flex:1}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:.75rem;font-weight:700}
/* รถ */
.carcard{border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:#fff}
.carcard.ok{border-color:var(--ok)}.carcard.warn{border-color:var(--warn)}
.plate{font-family:var(--f-head);font-weight:700;font-size:1.2rem;letter-spacing:.02em}
.carrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1.5px dashed var(--line);border-radius:12px;padding:10px}
.carrow .full{grid-column:1/-1}
/* ตั้งค่า */
.permtbl{overflow-x:auto}
.permtbl table{border-collapse:collapse;width:100%;min-width:560px;font-size:.88rem}
.permtbl th,.permtbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}
.permtbl th:first-child,.permtbl td:first-child{text-align:left;white-space:nowrap}
.permtbl input{width:20px;height:20px;accent-color:var(--teal)}
.dutybox{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mon-pos{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mon-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.mon-card h3{display:flex;justify-content:space-between;gap:8px;align-items:center}
#rm-body{display:flex;flex-direction:column;gap:26px}
.sumrow{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--muted)}

.modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,14,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.modal{align-items:center}}
.modal-box{position:relative;background:var(--surface);border-radius:18px;width:100%;max-width:500px;max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-box>.pill{align-self:flex-start}
.modal-x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:var(--sunk);cursor:pointer;font-size:1.2rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:10px;font-size:.92rem;z-index:60;max-width:calc(100% - 32px)}
.loading{color:var(--muted);text-align:center;padding:40px 0}
.sk{background:var(--sunk);border-radius:12px;height:110px}

.scan-ov{position:fixed;inset:0;z-index:70;background:rgba(8,12,11,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;color:#fff}
#reader{width:min(100%,460px);border-radius:12px;overflow:hidden;background:#000}
.scan-ov .msg{max-width:420px;text-align:center;font-size:.92rem}
.scan-ov .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.scan-ov .btn-line{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}

@media (max-width:520px){.hello h2{font-size:1.3rem}#whoname{display:none}.who{padding-right:4px}.row2{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}.tile{padding:13px}.tile p{display:none}}
@media (prefers-reduced-motion:no-preference){#app>*{animation:up .22s ease both}@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* ---------- ธีม CBC: ส่วนที่ปรับทับ ---------- */
body{background:linear-gradient(180deg,#e8f1f6 0,var(--bg) 260px) no-repeat,var(--bg)}
.top{border-top:4px solid var(--teal);box-shadow:0 6px 18px rgba(16,42,67,.05)}
.top-in{flex-wrap:wrap}
.mark{background:var(--teal-soft);color:var(--teal);border-radius:50%;width:46px;height:46px;box-shadow:0 0 0 2px #fff,0 1px 4px rgba(16,42,67,.18)}
.brand b{font-size:1.3rem}
.head-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fs{display:flex;align-items:center;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px}
.fs-l{font-size:.78rem;color:var(--muted);margin-right:4px}
.fs button{border:0;background:none;width:34px;height:34px;border-radius:50%;cursor:pointer;font-weight:700;color:var(--muted);font-family:var(--f-head);line-height:1}
.fs button[aria-pressed="true"]{background:var(--teal);color:#fff}
.av{background:var(--teal-soft);color:var(--teal)}
.who{background:#fff}
.panel{border-radius:16px;border-color:#dde7ef}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
/* ปุ่มเมนูหน้าแรก แบบปุ่มใหญ่ไล่เฉดของแอป CBC */
.tile{border:0;color:#fff;overflow:hidden;min-height:150px;transition:transform .12s ease,box-shadow .2s ease}
.tile::after{content:"";position:absolute;right:-34px;top:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.tile::before{content:"";position:absolute;right:18px;bottom:-46px;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.tile.t0{background:linear-gradient(150deg,#0f8f88 0%,#0a6b67 100%)}
.tile.t1{background:linear-gradient(150deg,#2b70c4 0%,#1a5196 100%)}
.tile.t2{background:linear-gradient(150deg,#6954bd 0%,#4c3a93 100%)}
.tile.t3{background:linear-gradient(150deg,#d08a1f 0%,#a5650c 100%)}
.tile.tadm{background:linear-gradient(150deg,#28465f 0%,#102a43 100%)}
.tile:hover{box-shadow:0 10px 24px rgba(16,42,67,.18)}
.tile .ic{background:rgba(255,255,255,.17);color:#fff}
.tile h3{font-size:1.15rem}
.tile p{color:rgba(255,255,255,.9)}
.count span{color:rgba(255,255,255,.85)}
.flag.bad{background:#fff;color:var(--bad)}
.ic{background:var(--teal-soft);color:var(--teal)}
/* ปุ่มกลับหน้าแรก ใหญ่ ขอบเข้ม */
.back{border:2px solid var(--ink);padding:9px 18px 9px 12px;font-size:1rem;box-shadow:var(--shadow)}
.back svg{width:22px;height:22px}
.btn-acc{box-shadow:0 2px 6px rgba(16,42,67,.14)}
.btn-line:hover{border-color:#b9cad8}
.big-act.btn-acc{background:linear-gradient(150deg,#0f8f88 0%,#0a6b67 100%)}
.big-act.btn-line{background:linear-gradient(150deg,#2b70c4 0%,#1a5196 100%);color:#fff;border:0}
.btn:active,.back:active,.chip:active,.tile:active,.listcard:active,.fs button:active{transform:scale(.97)}
.btn:disabled::before{content:"";width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;flex:none}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,95,174,.13)}
.chip[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.modal{background:rgba(10,24,40,.55)}
.modal-box{border-radius:18px;box-shadow:0 20px 50px rgba(10,24,40,.35)}
.modal-x{background:rgba(16,42,67,.08)}
.toast{box-shadow:0 10px 30px rgba(10,24,40,.3);font-weight:500}
.sk{background:linear-gradient(90deg,#edf2f6 25%,#f7fafc 40%,#edf2f6 60%);background-size:300% 100%;border-radius:12px}
.meter i{background:var(--teal)}
.ticket-no{border-color:var(--teal)}.ticket-no b{color:var(--teal)}
@media (prefers-reduced-motion:no-preference){
  .btn:disabled::before{animation:spin .7s linear infinite}
  .sk{animation:sh 1.3s ease infinite}
  .tick{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@media (max-width:520px){.fs-l{display:none}.brand b{font-size:1.12rem}.tile{min-height:130px}}
/* ================= แพ็กเกจโปร: ขาวกระจกฝ้า ทันสมัย ================= */

  --teal:#5b5bd6; --teal-soft:#ecebff; --blue:#3a7bea; --blue-soft:#e8f0ff; --violet:#8b5cf6; --violet-soft:#f1ebff; --acc:#5b5bd6;
  --m1:#5b5bd6; --m2:#3a7bea; --m3:#d9468f; --m4:#e08a1e;

[data-plan="pro"] .mark{background:linear-gradient(135deg,#6d6af0,#a77bf3);color:#fff;border-radius:14px;box-shadow:0 6px 16px rgba(91,91,214,.35)}
[data-plan="pro"] .av{background:linear-gradient(135deg,#6d6af0,#a77bf3);color:#fff}

[data-plan="pro"] .input{background:rgba(255,255,255,.75);border-color:var(--line);border-radius:14px}
[data-plan="pro"] .input:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(91,91,214,.14)}
[data-plan="pro"] .btn{border-radius:14px}
[data-plan="pro"] .btn-acc,[data-plan="pro"] .cam,[data-plan="pro"] .big-act.btn-acc{background:linear-gradient(135deg,#5b5bd6 0%,#8b5cf6 100%);box-shadow:0 6px 18px rgba(91,91,214,.32)}
[data-plan="pro"] .big-act.btn-line{background:linear-gradient(135deg,#3a7bea 0%,#5bb4f0 100%)}
[data-plan="pro"] .btn-line{background:var(--glass);border-color:var(--glass-b)}
[data-plan="pro"] .back{background:var(--glass);border:1.5px solid rgba(28,31,63,.55);border-radius:999px}
[data-plan="pro"] .seg button[aria-pressed="true"],[data-plan="pro"] .tabs button[aria-selected="true"],[data-plan="pro"] .fs button[aria-pressed="true"]{background:linear-gradient(135deg,#5b5bd6,#8b5cf6);color:#fff}

/* การ์ดรายรับ */

.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%)}
.hero .h-lab{font-size:.86rem;opacity:.9;display:flex;justify-content:space-between;gap:8px;align-items:center}
.hero .h-big{font-family:var(--f-head);font-size:2.3rem;font-weight:700;line-height:1.15;margin:4px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hero .h-sub{font-size:.88rem;opacity:.92}

.hero .h-m{display:flex;justify-content:space-between;font-size:.72rem;opacity:.85}
.hero .h-lab span{white-space:nowrap}.hero .h-chip{background:rgba(255,255,255,.2);border-radius:999px;padding:1px 10px;font-weight:600;font-size:.78rem}

.tile.tlock::before,.tile.tlock::after{display:none}
.tile.tlock .ic{background:#e6ebf0;color:#7d8fa1}

.pico{width:17px;height:17px;vertical-align:-3px;color:#5b5bd6}
.planbar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;font-size:.86rem;color:var(--muted);border:1px dashed var(--line);border-radius:14px;padding:10px 14px;background:var(--sunk)}

@media (prefers-reduced-motion:no-preference){
  [data-plan="pro"] body::before{animation:aur 26s ease-in-out infinite alternate}

  [data-plan="pro"] .tiles>.tile{animation:upP .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}

html[data-plan="pro"] .tile.tadm{background:#0B1A1E;color:#fff;border-color:#0B1A1E}html[data-plan="pro"] .tile.tadm h3{color:#fff}
html[data-plan="pro"] .tile.tadm p{color:#AEB8CC}html[data-plan="pro"] .tile.tadm .ic{background:#173339;color:#5EEAD4}
html[data-plan="pro"] .hero{box-shadow:0 18px 40px -18px rgba(15,118,110,.6)}

  --teal:#0F766E;--teal-soft:#E6F6F4;--acc:#0F766E;--m1:#0F766E;--m2:#2563EB;--m3:#7C3AED;--m4:#D97706;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 1px 1px rgba(15,23,42,.03);--f-head:"IBM Plex Sans Thai",system-ui,sans-serif}

}

/* ===== ใช้ร่วม: หน้าเชื่อมชีต + ผู้ช่วยคู่มือ ===== */
.cn-h{display:flex;gap:12px;align-items:flex-start}.cn-h>svg{width:34px;height:34px;flex:none;color:var(--acc,#5b5bd6)}
.cn-steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}.cn-steps li span{display:block;font-size:.88em;color:var(--muted)}
.cn-alt{display:flex;flex-wrap:wrap;gap:8px}.cn-alt .btn{flex:1 1 180px}
.cn-link{display:flex;flex-direction:column;gap:10px;align-items:center;border:1.5px dashed var(--line);border-radius:14px;padding:12px;width:100%}
.cn-link .mono{overflow-wrap:anywhere;text-align:center}.cn-qr{width:180px;max-width:70%}.cn-qr svg{width:100%;height:auto;display:block;background:#fff;border-radius:10px}
.helpfab{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;align-items:center;gap:0;
  border:0;background:transparent;cursor:pointer;font:600 .72rem/1 var(--f-head,inherit);color:var(--ink);padding:0;filter:drop-shadow(0 8px 16px rgba(60,60,150,.28))}

@media (prefers-reduced-motion:no-preference){.helpfab .bot{animation:botbob 3.5s ease-in-out infinite}.hp-say.pop{animation:botpop .25s ease-out}}
@keyframes botbob{50%{transform:translateY(-4px)}}@keyframes botpop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.hp{display:flex;flex-direction:column;gap:12px}.hp-top{display:flex;gap:10px;align-items:flex-start;padding-right:36px}.hp-top .bot{flex:none}
.hp-say{position:relative;background:var(--sunk,#f3f4fb);border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-size:.95em;line-height:1.55}
.hp-say::before{content:"";position:absolute;left:-7px;top:16px;width:12px;height:12px;background:inherit;border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.hp-list{display:flex;flex-direction:column;gap:6px}
.hp-q{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface,#fff);color:inherit;border-radius:12px;padding:10px 12px;font:inherit;cursor:pointer;min-height:48px}
.hp-q span{flex:1}.hp-q svg{width:20px;height:20px;flex:none;color:var(--acc,#5b5bd6)}.hp-q[aria-pressed=true]{border-color:var(--acc,#5b5bd6);background:color-mix(in srgb,var(--acc,#5b5bd6) 8%,transparent)}
.hp-h{display:flex;gap:8px;align-items:center;margin:4px 0}.hp-h svg{width:22px;height:22px;color:var(--acc,#5b5bd6)}
.hp-steps{margin:0;padding-left:0;list-style:none;counter-reset:hs;display:flex;flex-direction:column;gap:8px}
.hp-steps li{counter-increment:hs;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.hp-steps li::before{content:counter(hs);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#6d6af0,#a77bf3);color:#fff;font-weight:700;font-size:.85em}
.helprow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface,#fff);color:inherit;border-radius:16px;padding:10px 14px;font:inherit;cursor:pointer}
.helprow>span{flex:1;display:flex;flex-direction:column}.helprow>svg:last-child{width:20px;height:20px;color:var(--muted)}
.hp .tabs{display:flex;gap:6px}.hp .tabs button{flex:1;display:inline-flex;gap:6px;align-items:center;justify-content:center;min-height:44px;white-space:nowrap;padding:0 8px;font-size:.92em}
.hp .tabs button svg,.hp .linkbtn svg,.hp .alert svg{width:18px;height:18px;flex:none}.hp .linkbtn{display:inline-flex;gap:4px;align-items:center}
.hp .btn svg{width:20px;height:20px}

/* แถบเมนูซ้ายฉบับโปร (5 แอป): ชื่อร้านด้านบนยังกดกลับหน้าแรกได้ */
html[data-plan="pro"].has-side .top .brand{visibility:visible}
/* กล่อง "งานวันนี้" ในหน้าแรก (ใช้ทุกแอป) */

.today .ic-s{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--mute-bg);flex:none}
.today .ic-s.bad{background:var(--bad-bg);color:var(--bad)}
.zhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:4px 0 8px}.zhead h3{margin:0}

/* ===== ที่พักรายวัน / โรงแรม ===== */
.kbtn{text-align:left;cursor:pointer;font:inherit;color:inherit}.kbtn:active{transform:scale(.98)}.kpi.bad{border-color:var(--bad)}.kpi.bad b{color:var(--bad)}
.t-warn{background:var(--warn-bg);color:var(--warn)}
.scrollx{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}.scrollx .chip{flex:none}
.big-act{min-height:56px;font-size:1.08em}
#hk{grid-template-columns:1fr 1fr}#hk .kpi{padding:12px 14px}#hk .kpi-h{font-size:.85em}
.paysum{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--sunk)}
.paysum>div{display:flex;justify-content:space-between;gap:10px}.paysum .big{font-size:1.15em;color:var(--acc)}.paysum .bad{color:var(--bad);font-weight:700}.paysum .ok{color:var(--ok);font-weight:700}
.meter{height:12px;border-radius:99px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}.meter i{display:block;height:100%;background:var(--ok)}
.p-book{background:var(--info-bg,#e7eff9);color:var(--info,#1f5fae)}.p-in{background:var(--ok-bg);color:var(--ok)}.p-out{background:var(--sunk);color:var(--muted)}.p-cancel,.p-noshow{background:var(--bad-bg,#fde8e8);color:var(--bad)}
/* ผังห้อง */
.board{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.board table{border-collapse:separate;border-spacing:0;font-size:.8rem;min-width:100%}
.board th,.board td{height:40px;min-width:44px;max-width:44px;padding:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.board th{background:var(--sunk);font-weight:600;line-height:1.15;position:sticky;top:0;z-index:2}.board th small{display:block;font-weight:400;color:var(--muted);font-size:.68rem}
.board th.we{color:var(--bad)}.board th.td,.board td.td{background:color-mix(in srgb,var(--acc) 9%,transparent)}
.board .rh{position:sticky;left:0;z-index:3;min-width:64px;max-width:64px;background:var(--surface);font-weight:700;text-align:left;padding:0 6px;box-shadow:2px 0 0 var(--line)}
.board .rh small{display:block;font-weight:400;color:var(--muted);font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board th.rh{z-index:4;background:var(--sunk)}
.board .cell{display:block;width:100%;height:100%;border:0;background:none;cursor:pointer;color:transparent}.board .cell:hover,.board .cell:focus-visible{background:var(--sunk);color:var(--muted)}
.board .bar{display:flex;align-items:center;gap:4px;width:calc(100% - 4px);height:30px;margin:0 2px;border:0;border-radius:8px;padding:0 6px;font:inherit;font-size:.74rem;font-weight:600;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left}
.board .bar.b-book{background:#dbe7fb;color:#1f4f99}.board .bar.b-in{background:#d4f0de;color:#146c3c}.board .bar.b-out{background:#e9ecef;color:#6b7480}
.board .bar .dot{width:7px;height:7px;border-radius:50%;background:var(--bad);flex:none}
.board .fix{background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(180,35,24,.08) 6px 12px)}
.legend2{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--muted)}.legend2 i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
/* แม่บ้าน */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.hc{border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;background:var(--surface);font:inherit;color:inherit;text-align:left;cursor:pointer;min-height:84px}
.hc b{font-size:1.1rem}.hc span{font-size:.74rem;color:var(--muted)}.hc.c-dirty{border-color:var(--warn);background:var(--warn-bg)}.hc.c-fix{border-color:var(--bad);background:var(--bad-bg,#fde8e8)}.hc.c-ok{border-color:var(--ok)}
.hc .st{font-weight:700;font-size:.78rem}.hc.c-dirty .st{color:var(--warn)}.hc.c-fix .st{color:var(--bad)}.hc.c-ok .st{color:var(--ok)}
/* จอง */
.rpick{display:flex;flex-direction:column;gap:6px}

  try{const q=new URLSearchParams(location.search).get('k');if(q&&KEY_RE.test(q))store.set(CONNECT_KEY,q)}catch(e){}
  const k=store.get(CONNECT_KEY);return k&&KEY_RE.test(k)?'https://script.google.com/macros/s/'+k+'/exec':'';
}
const NEED_CONNECT=!DEMO&&!apiUrl();
{const m=document.getElementById('mark');if(m&&!m.innerHTML.trim())m.innerHTML=icon('logo')}   // โลโก้มุมบนขึ้นตั้งแต่หน้าแรก (ก่อนเชื่อมชีต / ก่อนเข้าสู่ระบบ)
const shopLink=()=>{const k=keyOf(apiUrl());return k?location.origin+location.pathname.replace(/[^/]*$/,'')+'?k='+k:''};
function vConnect(){
  document.documentElement.dataset.public='1';
  app.innerHTML=`<div class="narrow stack"><section class="panel"><div class="cn-h">${icon('link')}<div><h2>เชื่อมแอปกับ Google Sheets ของร้าน</h2><div class="small muted">${esc('แอปที่พักรายวัน / โรงแรม')} ใช้ฟรี ข้อมูลทั้งหมดอยู่ใน Google ของร้านคุณเอง</div></div></div>
    <ol class="cn-steps"><li><b>ติดตั้งโค้ดในชีตของร้าน</b><span>เปิด Google Sheets ใหม่ → ส่วนขยาย → Apps Script → วางโค้ด Code.gs → บันทึก</span></li>
      <li><b>ตั้งค่าครั้งแรก</b><span>กลับมาที่ชีต รีเฟรช แล้วกดเมนูของแอป → ตั้งค่าครั้งแรก (สร้างบัญชีเจ้าของ)</span></li>
      <li><b>ทำให้ใช้งานได้</b><span>การทำให้ใช้งานได้ → การทำให้ใช้งานได้รายการใหม่ → เว็บแอป · ดำเนินการเป็น: ฉัน · ผู้มีสิทธิ์เข้าถึง: ทุกคน → คัดลอกลิงก์เว็บแอป</span></li>
      <li><b>วางลิงก์ที่นี่</b><span>ลิงก์ขึ้นต้นด้วย https://script.google.com/macros/s/ และลงท้ายด้วย /exec</span></li></ol>
    <form class="form" id="cn-f" novalidate><div class="field"><label for="cn-u">ลิงก์เว็บแอป (/exec)</label><input class="input mono" id="cn-u" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="https://script.google.com/macros/s/.../exec"></div>
      <div id="cn-e"></div><button class="btn btn-acc btn-block" type="submit">${icon('link')}เชื่อมต่อ</button></form>
    <div class="cn-alt"><a class="btn btn-line" href="https://asuraphongapps54-prog.github.io/?install=hotel" target="_blank" rel="noopener">${icon('doc')}เปิดคู่มือติดตั้งแบบมีรูป</a><a class="btn btn-line" href="demo.html">${icon('spark')}ลองเดโมก่อน</a></div>

    busy(b,true,'กำลังตรวจลิงก์…');

function connectDone(org){
  const L=shopLink();
  app.innerHTML=`<div class="narrow stack"><section class="panel done"><div class="tick">${icon('check')}</div><h2>เชื่อมกับ ${esc(org||'ร้านของคุณ')} แล้ว</h2>
    <div class="small muted">ส่งลิงก์นี้ให้พนักงาน เปิดครั้งเดียวเครื่องจะจำไว้ กด "เพิ่มไปยังหน้าจอโฮม" ให้มีไอคอนเหมือนแอปได้</div>${linkBox(L)}
    <button class="btn btn-acc btn-block" id="cn-go">เปิดแอป</button></section></div>`;
  bindLinkBox();$('#cn-go').onclick=()=>{location.href=L}
}
/* กล่องลิงก์ร้าน: คัดลอก · ส่ง LINE · QR (ใช้ในหน้าเชื่อมต่อและในคู่มือ) */
const linkBox=L=>L?`<div class="cn-link"><div class="mono small" id="cn-l">${esc(L)}</div><div class="cn-qr" id="cn-qr" aria-label="QR ลิงก์ร้าน"></div>

function bindLinkBox(){const c=document.getElementById('cn-c'),q=document.getElementById('cn-qr'),L=shopLink();if(!L)return;
  if(c)c.onclick=()=>navigator.clipboard.writeText(L).then(()=>toast('คัดลอกแล้ว')).catch(()=>toast('กดค้างที่ลิงก์แล้วเลือกคัดลอก'));
  if(q)qrSvg(L).then(s=>{q.innerHTML=s}).catch(()=>{q.remove()})}
function disconnect(){store.del(CONNECT_KEY);location.href=location.pathname}

async function run(fn,...args){
  if(DEMO)return demoRun(fn,args);
  if(!apiUrl())throw new Error('ยังไม่ได้เชื่อมแอปกับชีตของร้าน');
  let res;
  try{res=await fetch(apiUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args}),redirect:'follow'})}
  catch(e){throw new Error('เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่')}
  let j;try{j=await res.json()}catch(e){throw new Error('ระบบตอบกลับผิดรูปแบบ ให้ผู้ดูแลตรวจการติดตั้ง Apps Script')}
  if(!j.ok){if(/เข้าสู่ระบบใหม่|กรุณาเข้าสู่ระบบ/.test(j.error)){clearTok();ME=null}throw new Error(j.error)}
  return j.data;
}
async function logout(){try{await run('apiLogout',tok())}catch(e){}clearTok();ME=null;if(DEMO)demoMark('login');boot()}
$('#who').onclick=()=>{if(!ME)return;const m=modal(`<h2 style="padding-right:40px">${esc(ME.first)} ${esc(ME.last||'')}</h2><div class="muted">${esc(ME.id)} · ${esc(ROLE_TH[ME.role]||'')}${ME.posLabel?' · '+esc(ME.posLabel):''}</div>${logoutBtn()}`);
  m.el.querySelector('[data-logout]').onclick=()=>{m.close();logout()}};

function demoProps(sh){if(DPLAN==='pro'){sh.props.PLAN='pro';sh.props.LICENSE='HO-DEMO-DEMO-DEMO';sh.props.LICENSEE='ร้านตัวอย่าง';sh.props.LICCHECK=String(Date.now())}else{delete sh.props.PLAN;delete sh.props.LICENSE;delete sh.props.LICENSEE}}
async function demoReady(){if(BACK)return;
  const src=new TextDecoder().decode(Uint8Array.from(atob(DSRC.split('').reverse().join('')),c=>c.charCodeAt(0)));
  const sh=GASShim({});demoProps(sh);sh.props.BIZTYPE=DTYPE;const G=loadGAS(src,sh,['seedDemo_','typeList_']);
  const ts=G.typeList_();if(!ts.some(t=>t.id===DTYPE)){DTYPE='hotel';sh.props.BIZTYPE='hotel'}$('#demo-type').innerHTML=ts.map(t=>`<option value="${t.id}" ${t.id===DTYPE?'selected':''}>${esc(t.label)}</option>`).join('');G.seedDemo_();BACK={A:G.API_FUNCS,sh};
  if(DAS!=='login'&&DAS!=='guest')demoLogin(DAS)}
function demoLogin(r){const u=DUSER[r];if(!u)return;const t=BACK.A.apiLogin(u[0],'test2569',u[1]).token;saveTok(t,false)}
async function demoRun(fn,args){await new Promise(r=>setTimeout(r,120));const f=BACK.A[fn];if(!f)throw new Error('ฟีเจอร์นี้อยู่ในแพ็กเกจโปร');
  try{return JSON.parse(JSON.stringify(f(...JSON.parse(JSON.stringify(args)))))}
  catch(e){const m=String(e&&e.message||e).replace(/^Exception:\s*/,'');if(/เข้าสู่ระบบใหม่|กรุณาเข้าสู่ระบบ/.test(m)){clearTok();ME=null}throw new Error(m)}}
function demoMark(r){DAS=r;store.set('hoDemoAs',r)}
function demoAdminTok(){return BACK.A.apiLogin('owner.som','test2569','admin').token}
async function demoGuest(tk){demoMark('guest');paintDemo();if(!tk){const t=demoAdminTok(),L=BACK.A.apiBooks(t,{}),b=L.find(x=>x.st==='book'&&x.bal>0)||L.find(x=>x.st==='book')||L[0];tk=b?BACK.A.apiBook(t,b.id).tok:''}ME=null;$('#who').hidden=true;vGuest(tk)}
function paintDemo(){const d=$('#demo');d.hidden=false;
  d.querySelectorAll('[data-r]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===DAS));d.querySelectorAll('[data-p]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===DPLAN))}
document.querySelectorAll('#demo-role [data-r]').forEach(b=>b.onclick=async()=>{const r=b.dataset.r;await demoReady();
  if(r==='guest')return demoGuest();demoMark(r);clearTok();ME=null;if(r!=='login')demoLogin(r);view={name:'home'};boot()});
document.querySelectorAll('#demo-plan [data-p]').forEach(b=>b.onclick=async()=>{DPLAN=b.dataset.p;store.set('hoDemoPlan',DPLAN);await demoReady();demoProps(BACK.sh);if(DAS==='guest')return demoGuest();boot()});
$('#demo-type').onchange=()=>{DTYPE=$('#demo-type').value;store.set('hoDemoType',DTYPE);BACK=null;clearTok();ME=null;view={name:'home'};if(DAS==='guest')demoMark('admin');boot()};

const BOT_NAME='น้องอาสา';
const botSvg=(sz)=>`<svg class="bot" width="${sz||44}" height="${sz||44}" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="bg-b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d6af0"/><stop offset="1" stop-color="#c86bd8"/></linearGradient></defs>
  <line x1="32" y1="6" x2="32" y2="14" stroke="#6d6af0" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="6" r="4" fill="#f5c26b"/>
  <rect x="8" y="14" width="48" height="40" rx="16" fill="url(#bg-b)"/><rect x="14" y="21" width="36" height="24" rx="11" fill="#fff"/>
  <circle cx="25" cy="32" r="4" fill="#2e2e9a"/><circle cx="39" cy="32" r="4" fill="#2e2e9a"/><circle cx="26.5" cy="30.5" r="1.3" fill="#fff"/><circle cx="40.5" cy="30.5" r="1.3" fill="#fff"/>
  <path d="M27 39q5 4 10 0" stroke="#2e2e9a" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="18" cy="40" r="2.6" fill="#ffb3cf"/><circle cx="46" cy="40" r="2.6" fill="#ffb3cf"/>
  <rect x="4" y="28" width="6" height="12" rx="3" fill="#8b7cf6"/><rect x="54" y="28" width="6" height="12" rx="3" fill="#8b7cf6"/></svg>`;
const whoOk=w=>!w||w==='all'||!!ME&&(w==='admin'?ME.role==='admin':w==='staff'?ME.role!=='admin'&&ME.role!=='tenant':ME.role===w);
function helpOpen(start){
  const M=typeof MANUAL!=='undefined'?MANUAL:{sections:[],faq:[]},secs=M.sections.filter(s=>whoOk(s.who)),faq=M.faq.filter(f=>whoOk(f[2]));
  const hello=ME?`สวัสดีครับ คุณ${esc(ME.nick||ME.first||'')} มีอะไรให้${BOT_NAME}ช่วยไหมครับ`:`สวัสดีครับ ${BOT_NAME}ช่วยแนะนำการใช้งานได้ครับ`;
  const m=modal(`<div class="hp"><div class="hp-top">${botSvg(56)}<div class="hp-say" id="hp-say">${hello}</div></div>
    <div class="tabs" role="tablist"><button role="tab" data-ht="man" aria-selected="true">${icon('doc')}คู่มือ</button><button role="tab" data-ht="faq" aria-selected="false">${icon('chat')}ถามบ่อย</button>${ME&&ME.role==='admin'&&typeof shopLink==='function'?`<button role="tab" data-ht="lnk" aria-selected="false">${icon('link')}ลิงก์ร้าน</button>`:''}</div>
    <div id="hp-b" class="stack"></div>${M.guide?`<a class="btn btn-line btn-block" href="${esc(M.guide)}" target="_blank" rel="noopener">${icon('doc')}เปิดคู่มือฉบับเต็ม (มีรูปหน้าจอ)</a>`:''}</div>`);
  const say=t=>{const s=m.el.querySelector('#hp-say');s.innerHTML=t;s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop')},b=()=>m.el.querySelector('#hp-b');
  const tab=k=>{m.el.querySelectorAll('[data-ht]').forEach(x=>x.setAttribute('aria-selected',x.dataset.ht===k));
    if(k==='man'){b().innerHTML=`<div class="hp-list">${secs.map((s,i)=>`<button type="button" class="hp-q" data-s="${i}">${icon(s.ic||'doc')}<span>${esc(s.t)}</span>${icon('chev')}</button>`).join('')||'<div class="empty">ยังไม่มีคู่มือ</div>'}</div>`;
      b().querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>sec(secs[+x.dataset.s]));say(hello)}
    if(k==='faq'){b().innerHTML=`<div class="hp-list">${faq.map((f,i)=>`<button type="button" class="hp-q" data-f="${i}">${icon('chat')}<span>${esc(f[0])}</span></button>`).join('')}</div>`;
      b().querySelectorAll('[data-f]').forEach(x=>x.onclick=()=>{say(esc(faq[+x.dataset.f][1]));b().querySelectorAll('[data-f]').forEach(y=>y.setAttribute('aria-pressed',y===x))});say('เลือกคำถามด้านล่างได้เลยครับ')}
    if(k==='lnk'){b().innerHTML=`<div class="small">ลิงก์นี้ใช้ได้ทุกคนในร้าน ส่งให้พนักงานเปิดครั้งเดียว เครื่องจะจำไว้</div>${linkBox(shopLink())}
      <div class="small muted">ย้ายไปใช้ชีตใหม่? <button type="button" class="linkbtn" id="hp-dc">เลิกเชื่อมเครื่องนี้</button></div>`;bindLinkBox();
      const dc=m.el.querySelector('#hp-dc');if(dc)dc.onclick=()=>{if(confirm('เลิกเชื่อมเครื่องนี้กับชีตของร้าน? ข้อมูลในชีตไม่หาย'))disconnect()};say('ส่งลิงก์ร้านให้พนักงานได้จากตรงนี้ครับ')}};
  const sec=s=>{b().innerHTML=`<button type="button" class="linkbtn" id="hp-bk">${icon('back')}กลับไปหัวข้อคู่มือ</button><h3 class="hp-h">${icon(s.ic||'doc')}${esc(s.t)}</h3>
    <ol class="hp-steps">${s.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${s.tip?`<div class="alert info small">${icon('spark','pico')} ${esc(s.tip)}</div>`:''}`;
    m.el.querySelector('#hp-bk').onclick=()=>tab('man');say(`ทำตามทีละข้อได้เลยครับ`)};
  m.el.querySelectorAll('[data-ht]').forEach(x=>x.onclick=()=>tab(x.dataset.ht));
  if(start&&start.sec){const s=secs.find(x=>x.id===start.sec);tab('man');if(s)sec(s)}else tab(start&&start.tab||'man');
}

  f.setAttribute('aria-label','คู่มือและคำถามที่พบบ่อย ('+BOT_NAME+')');f.innerHTML=botSvg(46)+'<span>คู่มือ</span>';f.onclick=()=>helpOpen();document.body.appendChild(f)})();

/* แถบเมนูด้านซ้ายของฉบับโปร (จอกว้าง 1024px ขึ้นไป) ใช้ร่วมกับแอปร้านอาหาร นัดคิว ร้านค้า ร้านซ่อม ที่พักรายวัน
   อ่านรายการเมนูจากไทล์ในหน้าแรก (#tiles .tile[data-go]) จึงไม่ต้องเขียนเมนูซ้ำในแต่ละแอป · หน้าตาใช้ CSS .pside จากแอปหอพัก */
(function(){
  let NAV=[],synced=Date.now(),busyNav=false,raf=0;
  const root=document.documentElement;
  const grab=()=>{const T=document.querySelectorAll('#tiles>.tile[data-go]');if(!T.length)return;
    NAV=[...T].map(t=>({go:t.dataset.go,label:((t.querySelector('h3')||t).textContent||'').trim(),ic:(t.querySelector('.ic')||{}).innerHTML||'',
      badge:((t.querySelector('.badge')||{}).textContent||'').trim(),lock:t.classList.contains('tlock')}))};
  const isOn=()=>{try{return PRO()&&!!ME&&!!BIZ&&!root.dataset.public&&!root.dataset.kitchen&&!['login','register','forgot','must'].includes(view.name)}catch(e){return false}};
  const openTile=g=>{const t=document.querySelector(`#tiles>.tile[data-go="${g}"]`);if(t){t.click();return}
    if(busyNav)return;busyNav=true;go('home');let n=0;
    const w=setInterval(()=>{const x=document.querySelector(`#tiles>.tile[data-go="${g}"]`);if(x||++n>40){clearInterval(w);busyNav=false;if(x)x.click()}},100)};
  function paint(){
    const on=isOn();root.classList.toggle('has-side',on);
    let el=document.getElementById('pside');if(!on){if(el)el.innerHTML='';return}
    grab();
    if(!el){el=document.createElement('aside');el.id='pside';el.className='pside';el.setAttribute('aria-label','เมนูหลัก');document.body.prepend(el)}
    const cur=view.name==='admin'?'admin':view.name;
    const nv=x=>`<button class="nv" data-sn="${esc(x.go)}" ${cur===x.go?'aria-current="page"':''}>${x.ic}${esc(x.label)}${x.lock?'<span class="lk">โปร</span>':x.badge?`<span class="cnt">${esc(x.badge)}</span>`:''}</button>`;
    const work=NAV.filter(x=>x.go!=='admin'),adm=NAV.filter(x=>x.go==='admin');
    el.innerHTML=`<div class="pb"><span class="mark">${icon('logo')}</span><div><b>${esc(BIZ.org||'')}</b><small>${esc(document.title)} · PRO</small></div></div>
      <button class="nv" data-sn="home" ${cur==='home'?'aria-current="page"':''}>${icon('home')}หน้าแรก</button>
      ${work.length?`<div class="grp">งานประจำวัน</div>${work.map(nv).join('')}`:''}${adm.length?`<div class="grp">จัดการ</div>${adm.map(nv).join('')}`:''}
      <div class="ft"><span id="psync">อัปเดตเมื่อสักครู่</span><button id="prf" title="ดึงข้อมูลล่าสุดจากชีต">ดึงข้อมูลล่าสุด</button></div>`;
    el.querySelectorAll('[data-sn]').forEach(b=>b.onclick=()=>{const g=b.dataset.sn;g==='home'?go('home'):openTile(g)});
    document.getElementById('prf').onclick=()=>{synced=Date.now();render();toast('ดึงข้อมูลล่าสุดแล้ว')};
  }
  const later=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(paint)};
  const start=()=>{const a=document.getElementById('app');if(!a)return setTimeout(start,200);
    new MutationObserver(later).observe(a,{childList:true,subtree:true});
    new MutationObserver(later).observe(root,{attributes:true,attributeFilter:['data-plan','data-public','data-kitchen']});later()};
  start();
  setInterval(()=>{const e=document.getElementById('psync');if(e){const s=Math.round((Date.now()-synced)/1e3);e.textContent=s<15?'อัปเดตเมื่อสักครู่':s<3600?'อัปเดต '+Math.round(s/60)+' นาทีที่แล้ว':'กดดึงข้อมูลล่าสุด'}},15e3);
})();

function csv(name,rows){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download=name+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* ---------- ผังห้องแบบปฏิทิน ---------- */
function vBoard(){
  const month=!!view.month;let from=view.from||(month?today().slice(0,8)+'01':addD(today(),-1));const days=month?new Date(+from.slice(0,4),+from.slice(5,7),0).getDate():14;
  app.innerHTML=`<div class="stack">${backHead('ผัง'+UN(),'แตะช่องว่างเพื่อจอง · แตะแถบสีเพื่อเปิดการจอง','calendar')}
    <div class="toolbar"><div class="chips"><button class="chip" id="bm2" aria-pressed="${!month}">2 สัปดาห์</button><button class="chip" id="bm" aria-pressed="${month}">ทั้งเดือน</button></div><div class="chips"><button class="chip" id="bp">‹ ก่อนหน้า</button><button class="chip" id="bt">วันนี้</button><button class="chip" id="bn">ถัดไป ›</button></div>
      <input class="input" type="date" id="bd" value="${from}" style="width:auto" aria-label="เริ่มที่วันที่"></div>
    <div class="legend2"><span><i style="background:#dbe7fb"></i>จองแล้ว</span><span><i style="background:#d4f0de"></i>เข้าพัก</span><span><i style="background:#e9ecef"></i>ออกแล้ว</span><span><i style="background:var(--bad)"></i>ค้างชำระ</span></div>
    <div id="bg">${loadingList}</div></div>`;
  const load=()=>run('apiBoard',tok(),from,days).then(d=>{if(!$('#bg'))return;
    const ds=Array.from({length:days},(_,i)=>addD(d.from,i)),td=d.today;
    const head=`<tr><th class="rh">${esc(UN())}</th>${ds.map(x=>`<th class="${dow(x)===0||dow(x)===6?'we':''}${x===td?' td':''}">${DOW[dow(x)]}<small>${+x.slice(8)}/${+x.slice(5,7)}</small></th>`).join('')}</tr>`;
    const rows=d.rooms.map(r=>{const bs=d.books.filter(b=>b.room===r.id);let html='',i=0;
      while(i<days){const day=ds[i],b=bs.find(x=>x.cin<=day&&x.cout>day);
        if(b){let n=0;while(i+n<days&&b.cout>ds[i+n])n++;html+=`<td colspan="${n}"><button class="bar b-${b.st}" data-b="${esc(b.id)}" title="${esc(b.guest)}">${b.bal?'<span class="dot"></span>':''}${esc(b.guest)}</button></td>`;i+=n}
        else{html+=`<td class="${day===td?'td':''}${r.clean==='fix'?' fix':''}"><button class="cell" data-new="${esc(r.id)}" data-d="${day}" aria-label="จอง ${esc(r.id)} ${day}" ${day<td||!can('book')?'tabindex="-1"':''}>+</button></td>`;i++}}
      return `<tr><td class="rh">${esc(r.id)}<small>${esc(r.type)}${r.clean==='dirty'?' · รอทำ':r.clean==='fix'?' · ปิดซ่อม':''}</small></td>${html}</tr>`}).join('');
    $('#bg').innerHTML=d.rooms.length?`<div class="board"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">ยังไม่มี${esc(UN())} ${can('rooms')?'<button class="linkbtn" id="b-add">เพิ่ม'+esc(UN())+'</button>':''}</div>`;
    bindB($('#bg'));{const a=$('#b-add');if(a)a.onclick=()=>go('rooms')}
    $('#bg').querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>{if(!can('book'))return;if(b.dataset.d<td)return toast('เลือกวันนี้หรือหลังจากนี้');go('new',{room:b.dataset.new,cin:b.dataset.d})});
    const tdc=$('#bg').querySelector('th.td');if(tdc){const bd=$('#bg .board');bd.scrollLeft=Math.max(0,tdc.offsetLeft-80)}
  }).catch(e=>{const g=$('#bg');if(g)g.innerHTML=errBox(e.message)});
  const mStart=(d,n)=>{const x=new Date(+d.slice(0,4),+d.slice(5,7)-1+n,1);return isoD(x)};
  $('#bm').onclick=()=>go('board',{month:true});$('#bm2').onclick=()=>go('board',{month:false});
  $('#bp').onclick=()=>{if(month)return go('board',{month:true,from:mStart(from,-1)});from=view.from=addD(from,-7);$('#bd').value=from;load()};
  $('#bn').onclick=()=>{if(month)return go('board',{month:true,from:mStart(from,1)});from=view.from=addD(from,7);$('#bd').value=from;load()};
  $('#bt').onclick=()=>{if(month)return go('board',{month:true});from=view.from=addD(today(),-1);$('#bd').value=from;load()};$('#bd').onchange=()=>{const v=$('#bd').value||today();if(month)return go('board',{month:true,from:v.slice(0,8)+'01'});from=view.from=v;load()};
  load();
}

function printDoc(html,title,w){let r=document.getElementById('printroot');if(!r){r=document.createElement('div');r.id='printroot';document.body.appendChild(r)}
  r.innerHTML=html;const h=document.documentElement,t0=document.title;h.classList.add('print-mode');if(w)h.classList.add('print-roll');

  pg.textContent=w?`@page{size:${w}mm auto;margin:2mm}#printroot .doc{width:${w-6}mm}`:'@page{size:A4;margin:14mm}';if(title)document.title=title;
  const done=()=>{h.classList.remove('print-mode','print-roll');document.title=t0;window.removeEventListener('afterprint',done)};

function niceMax(v){if(v<=4)return 4;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const k of [1,2,2.5,5,10])if(k*p>=v)return k*p;return 10*p}
function drawBars(el,d,fmt){const W=Math.max(280,el.clientWidth),H=190,L=44,R=6,T=12,B=24,pw=W-L-R,ph=H-T-B;fmt=fmt||(v=>baht(Math.round(v)));
  const max=niceMax(Math.max(1,...d.map(x=>x.a))),step=pw/Math.max(1,d.length),bw=Math.max(2,Math.min(18,step*.6)),every=d.length<=12?1:d.length<=31?5:15;let g='';
  [0,.5,1].forEach(f=>{const y=T+ph-ph*f;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-5}" y="${y+4}" text-anchor="end">${fmt(max*f)}</text>`});
  d.forEach((x,i)=>{const cx=L+i*step+step/2;if(x.a>0){const h=ph*x.a/max;g+=`<rect x="${cx-bw/2}" y="${T+ph-h}" width="${bw}" height="${Math.max(1,h)}" rx="2" fill="var(--m1)"><title>${fmt(x.a)}</title></rect>`}
    if(i%every===0||i===d.length-1)g+=`<text x="${cx}" y="${H-7}" text-anchor="middle">${esc(x.l)}</text>`});
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟ">${g}</svg>`}

    app.querySelectorAll('[data-bt]').forEach(b=>b.onclick=async()=>{try{await run('apiSaveSettings',tok(),{type:b.dataset.bt});await boot2();toast('เปลี่ยนเป็น '+BIZ.typeLabel+' แล้ว');paneSettings()}catch(e){$('#s-e0').innerHTML=errBox(e.message)}});
    const save=(id,eid,data,msg)=>{const b0=$(id);if(!b0)return;b0.onclick=async()=>{const b=$(id);busy(b,true);try{await run('apiSaveSettings',tok(),data());toast(msg);await boot2()}catch(e){$(eid).innerHTML=errBox(e.message)}busy(b,false)}};
    save('#s-s1','#s-e1',()=>({org:$('#s-org').value,shop:{phone:$('#s-ph').value,line:$('#s-ln').value,addr:$('#s-ad').value,map:$('#s-mp').value,cin:$('#s-ci').value,cout:$('#s-co').value,policy:$('#s-po').value,footer:$('#s-ft').value}}),'บันทึกข้อมูลที่พักแล้ว');
    save('#s-s2','#s-e2',()=>{const o={};Object.keys(st.pos).forEach(k=>o[k]=[...app.querySelectorAll(`[data-pp="${k}"][aria-pressed=true]`)].map(b=>b.dataset.f));return {perms:o}},'บันทึกสิทธิ์แล้ว');
    save('#s-s3','#s-e3',()=>({pay:{pp:$('#pp-n').value,name:$('#pp-a').value,bank:$('#pp-b').value}}),'บันทึกพร้อมเพย์แล้ว');
    save('#s-s4','#s-e4',()=>({receipt:{name:$('#rc-n').value,addr:(st.shop||{}).addr||'',tax:$('#rc-t').value}}),'บันทึกหัวใบเสร็จแล้ว');
    save('#s-s5','#s-e5',()=>({privacy:$('#pv-t').value}),'บันทึกแล้ว');
    if($('#rt-l')){const add=x=>{x=x||{};$('#rt-l').insertAdjacentHTML('beforeend',`<div class="paysum" data-rt><div class="row2"><input class="input" data-n placeholder="ชื่อช่วง เช่น สงกรานต์" value="${esc(x.name||'')}"><input class="input mono" data-p inputmode="numeric" placeholder="+30 หรือ -20 (%)" value="${x.pct!=null?x.pct:''}"></div>
        <div class="row2"><input class="input" type="date" data-f value="${esc(x.from||'')}" aria-label="ตั้งแต่"><input class="input" type="date" data-t value="${esc(x.to||'')}" aria-label="ถึง"></div><button type="button" class="linkbtn" data-x>ลบช่วงนี้</button></div>`);
        const el=$('#rt-l').lastElementChild;el.querySelector('[data-x]').onclick=()=>el.remove()};(st.rates||[]).forEach(add);$('#rt-a').onclick=()=>add();
      save('#s-s6','#s-e6',()=>({rates:[...app.querySelectorAll('[data-rt]')].map(e=>({name:e.querySelector('[data-n]').value,pct:e.querySelector('[data-p]').value,from:e.querySelector('[data-f]').value,to:e.querySelector('[data-t]').value}))}),'บันทึกราคาช่วงเทศกาลแล้ว')}
    if($('#xs-l')){const add=x=>{x=x||{};$('#xs-l').insertAdjacentHTML('beforeend',`<div class="row2" data-xs style="grid-template-columns:1fr 110px auto"><input class="input" data-n value="${esc(x.n||'')}" placeholder="ชื่อบริการ"><input class="input mono" data-p inputmode="decimal" value="${x.p||''}" placeholder="ราคา"><button type="button" class="btn btn-bad btn-sm" data-x aria-label="ลบ">${icon('trash')}</button></div>`);
        const el=$('#xs-l').lastElementChild;el.querySelector('[data-x]').onclick=()=>el.remove()};(st.extras||[]).forEach(add);$('#xs-a').onclick=()=>add();
      save('#s-s7','#s-e7',()=>({extras:[...app.querySelectorAll('[data-xs]')].map(e=>({n:e.querySelector('[data-n]').value,p:e.querySelector('[data-p]').value}))}),'บันทึกบริการเสริมแล้ว')}
  }).catch(e=>{const p=$('#pane');if(p)p.innerHTML=errBox(e.message)});
}

/* ---------- หน้ายืนยันการจองของแขก (?g=รหัส) ไม่ต้องล็อกอิน ---------- */
async function vGuest(tk){
  document.documentElement.dataset.public='1';app.innerHTML=`<div class="narrow stack"><div class="sk"></div></div>`;
  let p;try{p=await run('pubBooking',tk)}catch(e){app.innerHTML=`<div class="narrow">${errBox(e.message)}</div>`;return}
  $('#org').textContent=p.org;$('#bizname').textContent='ยืนยันการจอง';$('#mark').innerHTML=icon('logo');document.title=p.org+' · '+p.id;
  const s=p.shop||{},u=(p.words||{}).unit||'ห้อง',msg={book:'ที่พักได้รับการจองของคุณแล้ว',in:'ยินดีต้อนรับ ขอให้พักผ่อนอย่างมีความสุข',out:'ขอบคุณที่มาพักกับเรา',cancel:'การจองนี้ถูกยกเลิก',noshow:'การจองนี้ถูกบันทึกว่าไม่มาตามนัด'}[p.st];
  app.innerHTML=`<div class="narrow stack"><section class="panel gtop"><div class="small muted">การจอง <span class="mono">${esc(p.id)}</span></div><h2 style="margin:4px 0">คุณ${esc(p.guest)}</h2>${stPill(p.st)}<p style="margin:6px 0 0">${esc(msg)}</p>
      <div class="dates"><div><span class="small muted">เช็กอิน</span><b>${esc(dS(p.cin))}</b><span class="small">${esc(DOW[dow(p.cin)])}. ${s.cin?'ตั้งแต่ '+esc(s.cin):''}</span></div><span>→</span><div><span class="small muted">เช็กเอาต์</span><b>${esc(dS(p.cout))}</b><span class="small">${esc(DOW[dow(p.cout)])}. ${s.cout?'ก่อน '+esc(s.cout):''}</span></div></div>
      <div class="small">${p.nights} คืน · ${p.pax} คน · ${esc(u)} ${esc(p.room)}${p.type?' ('+esc(p.type)+')':''}</div></section>
    <section class="panel"><h3>ค่าใช้จ่าย</h3><div class="dline"><span>ค่า${esc(u)} ${p.nights} คืน</span><span class="amt">${money(p.roomAmt)}</span></div>${p.disc?`<div class="dline"><span>ส่วนลด</span><span class="amt">−${money(p.disc)}</span></div>`:''}
      ${p.extras.map(x=>`<div class="dline"><span>${esc(x.n)} × ${x.q}</span><span class="amt">${money(x.p*x.q)}</span></div>`).join('')}<div class="dline"><b>ยอดรวม</b><b class="amt">${money(p.total)}</b></div>
      <div class="paysum" style="margin-top:8px"><div><span>ชำระแล้ว</span><b>${money(p.paid)}</b></div><div class="${p.bal>0?'bad':'ok'}"><span>${p.bal>0?'คงเหลือ':'ชำระครบแล้ว'}</span><b>${p.bal>0?money(p.bal)+' บาท':''}</b></div></div>
      ${p.pay?payBox(p.pay,p.bal,DEMO)+'<div class="small muted">โอนแล้วส่งสลิปให้ที่พักทาง LINE หรือแสดงตอนเช็กอิน</div>':p.bal>0&&['book','in'].includes(p.st)?'<div class="small muted">ชำระยอดคงเหลือที่เคาน์เตอร์ตอนเช็กอิน</div>':''}${p.receipt?`<div class="small">ใบเสร็จ ${esc(p.receipt)}</div>`:''}</section>
    ${s.policy?`<section class="panel"><h3>เงื่อนไขการเข้าพัก</h3><div class="small">${esc(s.policy).replace(/\n/g,'<br>')}</div></section>`:''}
    <section class="panel"><h3>${esc(p.org)}</h3><div class="stack">${s.phone?`<a class="btn btn-acc" href="tel:${esc(s.phone)}">${icon('phone')}โทร ${esc(fmtPh(s.phone))}</a>`:''}
      ${s.line?`<a class="btn btn-line" href="https://line.me/R/ti/p/${encodeURIComponent(s.line.startsWith('@')?s.line:'@'+s.line)}" target="_blank" rel="noopener">${icon('chat')}LINE ${esc(s.line)}</a>`:''}
      ${s.map?`<a class="btn btn-line" href="${esc(s.map)}" target="_blank" rel="noopener">${icon('home')}เปิดแผนที่</a>`:''}</div>${s.addr?`<div class="small muted" style="margin-top:8px">${esc(s.addr)}</div>`:''}</section>
    <button class="btn btn-line" id="rf">โหลดข้อมูลล่าสุด</button><div class="small muted" style="text-align:center">ระบบจองโดย ${esc(DEV)}</div></div>`;
  $('#rf').onclick=()=>vGuest(tk);
}

/* ---------- เส้นทาง ---------- */
function render(){
  if(!BIZ)return;delete document.documentElement.dataset.public;paintHead();
  if(!ME&&!['login','register','forgot'].includes(view.name))view={name:'login'};
  ({login:vLogin,register:vRegister,forgot:vForgot,must:vMust,home:vHome,board:vBoard,new:vNew,book:vBook,books:vBooks,house:vHouse,rooms:vRooms,report:vReport,admin:vAdmin})[view.name]();
  bindBack();bindLogout();app.querySelectorAll('[data-privacy]').forEach(b=>b.onclick=showPrivacy);window.scrollTo(0,0);
}
function go(name,o){view=Object.assign({name},o||{});render()}

/* ---------- เข้าสู่ระบบ / สมัคร ---------- */
let pickRole=['staff','admin'].includes(store.get('hoRole'))?store.get('hoRole'):'staff',tempPw='';
const ROLES=[['staff','พนักงาน','user'],['admin','เจ้าของ','key']];
const roleChips=()=>`<div class="field"><span class="lab">ฉันเป็น</span><div class="roles" role="group" aria-label="บทบาท">${ROLES.map(r=>`<button type="button" class="role" data-role="${r[0]}" aria-pressed="${r[0]===pickRole}">${icon(r[2])}${r[1]}</button>`).join('')}</div></div>`;
function bindRoles(cb){app.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{pickRole=b.dataset.role;store.set('hoRole',pickRole);app.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed',x===b));cb&&cb()})}
async function afterLogin(me){ME=me;if(ME.must){view={name:'must'};render();return}if(['login','register','forgot','must'].includes(view.name))view={name:'home'};render()}
function vLogin(){
  app.innerHTML=`<div class="narrow stack"><section class="panel"><h2>เข้าสู่ระบบ</h2>
    <form class="form" id="f" novalidate>${roleChips()}
      <div class="field"><label for="l-id">ชื่อผู้ใช้</label><input class="input" id="l-id" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
      <div class="field"><label for="l-pw">รหัสผ่าน</label><input class="input" id="l-pw" type="password" autocomplete="current-password"></div>
      <label class="small" style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="l-rem" checked style="width:20px;height:20px;accent-color:var(--teal);flex:none"><span>จำการเข้าสู่ระบบในเครื่องนี้ <span class="muted">(เอาออกถ้าเป็นเครื่องที่ใช้ร่วมกัน)</span></span></label>
      ${DEMO?'<div class="alert warn small">โหมดตัวอย่าง: ใช้แถบด้านบนสลับบทบาทได้เลย หรือเข้าด้วย owner.som / fon.front / pim.house รหัส test2569</div>':''}
      <div id="err"></div><button class="btn btn-acc btn-block" type="submit">เข้าสู่ระบบ</button></form>
    <button class="linkbtn" id="to-forgot">ลืมรหัสผ่าน</button><button class="btn btn-line" id="to-reg">ยังไม่มีบัญชี สมัครใช้งาน</button>
    <button class="linkbtn" data-privacy>การเก็บข้อมูลส่วนบุคคล</button></section></div>`;
  bindRoles();$('#to-reg').onclick=()=>go('register');$('#to-forgot').onclick=()=>go('forgot');
  $('#f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]');busy(b,true,'กำลังตรวจสอบ…');
    try{tempPw=$('#l-pw').value;const r=await run('apiLogin',$('#l-id').value,tempPw,pickRole);saveTok(r.token,$('#l-rem').checked);view={name:'home'};await boot()}catch(err){$('#err').innerHTML=errBox(err.message);busy(b,false)}};
}
function vRegister(){
  app.innerHTML=`<div class="narrow stack"><section class="panel"><h2>สมัครใช้งาน</h2><form class="form" id="f" novalidate>${roleChips()}
      <div class="alert info" id="r-note"></div>
      <div class="row2"><div class="field"><label for="r-first">ชื่อ</label><input class="input" id="r-first" autocomplete="given-name"></div><div class="field"><label for="r-last">นามสกุล</label><input class="input" id="r-last" autocomplete="family-name"></div></div>
      <div class="field"><label for="r-phone">เบอร์มือถือ</label><input class="input mono" id="r-phone" inputmode="tel" autocomplete="tel" placeholder="08x-xxx-xxxx"></div>
      <div class="field" id="r-posf"><span class="lab">ตำแหน่งงาน</span><div class="chips">${Object.entries(BIZ.pos||{}).map(([k,v])=>`<button type="button" class="chip" data-pos="${k}" aria-pressed="false">${esc(v)}</button>`).join('')}</div></div>
      <div class="field"><label for="r-id">ตั้งชื่อผู้ใช้</label><input class="input" id="r-id" autocomplete="username" autocapitalize="none" spellcheck="false"><span class="small muted">a–z ตัวเลข . _ - ยาว 3–20 ตัว เช่น fon.front</span></div>
      <div class="field"><label for="r-pw">ตั้งรหัสผ่าน</label><input class="input" id="r-pw" type="password" autocomplete="new-password"><span class="small muted">6–20 ตัว ห้ามใช้ 123456 หรือ 111111</span></div>
      <div class="field"><label for="r-pw2">ยืนยันรหัสผ่าน</label><input class="input" id="r-pw2" type="password" autocomplete="new-password"></div>
      <label class="small" style="display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:12px"><input type="checkbox" id="r-ok" style="width:22px;height:22px;accent-color:var(--teal);flex:none">
        <span>ฉันอ่านและยินยอมตาม <button type="button" class="linkbtn" data-privacy style="padding:0">การเก็บข้อมูลส่วนบุคคล</button></span></label>
      <div id="err"></div><button class="btn btn-acc btn-block" type="submit">สมัคร</button></form><button class="btn btn-line" id="to-login">มีบัญชีแล้ว เข้าสู่ระบบ</button></section></div>`;
  let pos='';app.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{pos=b.dataset.pos;app.querySelectorAll('[data-pos]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  const paint=()=>{$('#r-posf').hidden=pickRole!=='staff';$('#r-note').textContent=pickRole==='admin'?'คนแรกที่สมัครจะเป็นเจ้าของ คนต่อไปต้องให้เจ้าของอนุมัติ':'สมัครแล้วรอเจ้าของอนุมัติ จึงเข้าใช้งานได้'};paint();bindRoles(paint);
  $('#to-login').onclick=()=>go('login');
  $('#f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]'),v=k=>$('#r-'+k).value.trim();
    if($('#r-pw').value!==$('#r-pw2').value){$('#err').innerHTML=errBox('รหัสผ่านสองช่องไม่ตรงกัน');return}
    if(!$('#r-ok').checked){$('#err').innerHTML=errBox('กรุณากดยินยอมการเก็บข้อมูลส่วนบุคคลก่อนสมัคร');return}
    busy(b,true);
    try{const r=await run('apiRegister',{consent:true,role:pickRole,first:v('first'),last:v('last'),phone:v('phone'),id:v('id'),pw:$('#r-pw').value,pos:pickRole==='staff'?pos:''});
      app.innerHTML=`<div class="narrow"><section class="panel done"><div class="tick">${icon('check')}</div><h2>${r.firstAdmin?'สร้างบัญชีเจ้าของแล้ว':'สมัครเรียบร้อย รอเจ้าของอนุมัติ'}</h2>
        <div class="ticket-no" style="width:100%"><span class="small muted">ชื่อผู้ใช้ของคุณ</span><b>${esc(r.id)}</b></div><button class="btn btn-acc btn-block" id="ok">ไปหน้าเข้าสู่ระบบ</button></section></div>`;$('#ok').onclick=()=>go('login')}
    catch(err){$('#err').innerHTML=errBox(err.message);busy(b,false)}};
}
function paintHead(){
  document.documentElement.dataset.plan=PRO()?'pro':'free';
  $('#mark').innerHTML=icon('logo');$('#org').textContent=BIZ.org;$('#bizname').innerHTML=esc(BIZ.typeLabel||BIZ.name)+(PRO()?'<span class="pro-b">PRO</span>':'');
  $('#who').hidden=!ME;if(ME){$('#av').textContent=(ME.nick||ME.first||'?').slice(0,1);$('#whoname').textContent=ME.nick||ME.first}
  const lf=$('#licfoot');lf.hidden=false;lf.innerHTML=(BIZ.licensee?`ใบอนุญาตใช้งาน: <b>${esc(BIZ.licensee)}</b> · `:'')+`พัฒนาโดย ${esc(BIZ.dev||DEV)}`+(BIZ.ver?` · v${esc(BIZ.ver)}`:'')+(BIZ.support?' · <button class="linkbtn" id="supbtn">ติดต่อผู้พัฒนา</button>':'');
  {const sb=$('#supbtn');if(sb)sb.onclick=showSupport}
  if(DEMO)paintDemo();
}

/* ---------- เริ่มแอป ---------- */
async function boot2(){try{const d=await run('apiInit',tok());BIZ=d.biz;if(d.me)ME=d.me}catch(e){}}
async function boot(){
  document.querySelectorAll('.modal').forEach(m=>m.remove());
  if(NEED_CONNECT)return vConnect();
  const gk=DEMO?'':new URLSearchParams(location.search).get('g');
  try{if(DEMO)await demoReady();
    const d=await run('apiInit',DEMO&&DAS==='guest'?'':tok());BIZ=d.biz;
    if(gk){paintHead();$('#who').hidden=true;vGuest(gk.replace(/[^a-f0-9]/g,'').slice(0,24));return}
    if(DEMO&&DAS==='guest'){paintHead();return demoGuest()}
    if(d.me){await afterLogin(d.me);return}
    ME=null;view={name:'login'};render()}
  catch(err){app.innerHTML=`<div class="narrow">${errBox('โหลดไม่สำเร็จ: '+err.message)}</div>`}
}
$('#brand').onclick=()=>{if(!DEMO&&new URLSearchParams(location.search).get('g'))return;if(DEMO&&DAS==='guest')return;ME?go('home'):go('login')};
document.querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>setFs(b.dataset.fs));setFs(store.get('hoFs')||'1');
boot();

})();
</script>
